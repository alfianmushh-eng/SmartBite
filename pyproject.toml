[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartbite"
version = "0.1.0"
description = "AI-powered food quality inspection with computer vision"
readme = "README.md"
authors = [
    { name = "SmartBite Engineering", email = "dev@smartbite.ai" },
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "torch>=2.0",
    "torchvision>=0.15",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/alfianmushh-eng/SmartBite"
Repository = "https://github.com/alfianmushh-eng/SmartBite"
