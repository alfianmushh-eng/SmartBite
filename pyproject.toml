[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartbite"
version = "0.1.0"
description = "AI-powered food quality inspection with computer vision"
readme = "README.md"
authors = [
    { name = "SmartBite Engineering", email = "dev@smartbite.ai" },
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "tqdm>=4.64",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/alfianmushh-eng/SmartBite"
Repository = "https://github.com/alfianmushh-eng/SmartBite"

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn>=0.23"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "black>=23.0", "flake8>=6.0"]
viz = ["matplotlib>=3.7", "streamlit>=1.28"]
full = ["smartbite[api,dev,viz]"]

[project.scripts]
smartbite = "scripts.predict:main"
smartbite-batch = "scripts.batch_analyze:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
